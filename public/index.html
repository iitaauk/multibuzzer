<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Multiplayer buzzer system for quiz bowl"
    />
    <meta property="og:title" content="Buzzer" />
    <meta property="og:url" content="https://www.multibuzz.app" />
    <meta property="og:image" content="%PUBLIC_URL%/social.png" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Free online multiplayer buzzer system. Perfect for trivia night, quiz bowl, classrooms, and more."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="%PUBLIC_URL%/twitter.png" />
    <meta name="twitter:title" content="Buzzer" />
    <meta
      name="twitter:description"
      content="Free online multiplayer buzzer system. Perfect for trivia night, quiz bowl, classrooms, and more."
    />

    <!-- FAVICON -->
    <!-- iOS Safari caches apple-touch-icon (and to a lesser extent the
         other icons) very aggressively, keyed to the exact URL - a plain
         Clear-History-and-Website-Data pass does not reliably bust it, nor
         does redeploying the same filename with new bytes. The ?v= query
         string is the actual fix: it's tied to package.json's version
         (REACT_APP_VERSION, set by the build/client npm scripts), so any
         version bump automatically busts these regardless of whether that
         release actually touched the icon files - no separate counter to
         remember to bump. -->
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico?v=%REACT_APP_VERSION%" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png?v=%REACT_APP_VERSION%"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png?v=%REACT_APP_VERSION%"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon-16x16.png?v=%REACT_APP_VERSION%"
    />
    <link
      rel="mask-icon"
      href="%PUBLIC_URL%/safari-pinned-tab.svg?v=%REACT_APP_VERSION%"
      color="#348df5"
    />
    <meta name="msapplication-TileColor" content="#348df5" />
    <meta name="theme-color" content="#282c35" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest?v=%REACT_APP_VERSION%" />

    <!-- "Add to Home Screen" on iOS Safari doesn't read manifest.json for
         these - it needs its own meta tags to get a real name (instead of
         falling back to <title>) and to launch standalone instead of as a
         plain Safari tab. -->
    <meta name="apple-mobile-web-app-title" content="Buzzer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Buzzer</title>
    <meta name="title" content="Buzzer" />
    <meta
      name="description"
      content="Free online multiplayer buzzer system. Perfect for trivia night, quiz bowl, classrooms, and more."
    />

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=%REACT_APP_GA%"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', '%REACT_APP_GA%');
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
